name: Java CI/CD Pipeline

# Dois ambientes, escolhidos pela branch:
#   main    -> production (parametros SSM em /tech-challenge/*)
#   homolog -> homolog    (parametros SSM em /tech-challenge-homolog/*)
# O nome do cluster EKS, o repositorio ECR, o banco e o segredo JWT de cada
# ambiente sao publicados no SSM pelos repos infra-k8s, infra-db e
# auth-lambda - este pipeline so precisa saber o prefixo.
on:
  push:
    branches: [ "main", "homolog" ]
  pull_request:
    branches: [ "main", "homolog" ]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  SSM_PREFIX: ${{ github.ref_name == 'homolog' && '/tech-challenge-homolog' || '/tech-challenge' }}
  K8S_NAMESPACE: tech-challenge
  K8S_DEPLOYMENT: tech-challenge-app
  K8S_CONTAINER: app

jobs:
  # JOB 1: ETAPA DE BUILD (COMPILAÇÃO)
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar Aplicação e Gerar Pacote (sem rodar testes)
        run: ./mvnw clean package -DskipTests -B

      - name: Upload dos artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: target-build
          path: target/

  # JOB 2: TESTES UNITÁRIOS
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Download dos artefatos de build
        uses: actions/download-artifact@v4
        with:
          name: target-build
          path: target/

      - name: Executar Testes Unitários
        run: ./mvnw test -Dtest='!CucumberRunnerTest,!*IT' -B

      - name: Gerar Relatório JaCoCo (Unitários)
        if: always()
        run: ./mvnw jacoco:report -B

      - name: Upload do Relatório JaCoCo (Unitários)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-unit
          path: target/site/jacoco/

      - name: Upload de Relatórios de Falha (Surefire)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # JOB 3: TESTES DE INTEGRAÇÃO
  integration-test:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Download dos artefatos de build
        uses: actions/download-artifact@v4
        with:
          name: target-build
          path: target/

      - name: Executar Testes de Integração (Failsafe)
        run: ./mvnw verify -Pintegration-tests -Dsurefire.skip=true -B

      - name: Upload do Relatório JaCoCo (Integração)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-integration
          path: target/site/jacoco/

      - name: Upload de Relatórios de Falha (Failsafe)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/

  # JOB 4: BUILD E PUSH DA IMAGEM PARA O ECR
  build-and-push-image:
    name: Build & Push (ECR)
    runs-on: ubuntu-latest
    needs: [ test, integration-test ]
    # Só roda quando o PR for mergeado na main/homolog (push) ou via dispatch manual — nunca em pull_request.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog' || github.event_name == 'workflow_dispatch')

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Descobrir Repositório ECR do Ambiente
        run: |
          ECR_REPOSITORY=$(aws ssm get-parameter --name "$SSM_PREFIX/ecr_repository_name" --query Parameter.Value --output text)
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> "$GITHUB_ENV"

      - name: Build, Tag e Push da Imagem Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # JOB 5: DEPLOY NO CLUSTER KUBERNETES (EKS)
  # Pressupõe que o cluster, o banco e a Lambda do ambiente já foram
  # provisionados pelos repositórios infra-k8s, infra-db e auth-lambda.
  deploy:
    name: Deploy (EKS)
    runs-on: ubuntu-latest
    needs: build-and-push-image
    environment: ${{ github.ref_name == 'homolog' && 'homolog' || 'production' }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Atualizar kubeconfig do Cluster EKS
        run: |
          EKS_CLUSTER_NAME=$(aws ssm get-parameter --name "$SSM_PREFIX/eks_cluster_name" --query Parameter.Value --output text)
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          # Disponível para os próximos steps (usado pelo Helm do New Relic)
          echo "EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME" >> "$GITHUB_ENV"

      - name: Criar Namespace
        run: kubectl apply -f k8s/namespace.yaml

      # Os valores reais do Secret vêm do SSM do ambiente (publicados pelos
      # repos infra-db e auth-lambda), não do k8s/secret.yaml versionado, que
      # só tem placeholders para rodar local (Kind).
      - name: Criar Secret a partir do SSM
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          ssm() { aws ssm get-parameter --name "$SSM_PREFIX/$1" --with-decryption --query Parameter.Value --output text; }
          RDS_ENDPOINT=$(ssm rds_endpoint)
          RDS_PORT=$(ssm rds_port)
          RDS_DB_NAME=$(ssm rds_db_name)
          DB_USER=$(ssm rds_user)
          DB_PASS=$(ssm rds_password)
          JWT_SECRET=$(ssm jwt_secret)
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$JWT_SECRET"

          # RDS exige SSL (rds.force_ssl=1), por isso o sslmode=require explícito.
          kubectl -n "$K8S_NAMESPACE" create secret generic tech-challenge-secrets             --from-literal=SPRING_DATASOURCE_URL="jdbc:postgresql://$RDS_ENDPOINT:$RDS_PORT/$RDS_DB_NAME?sslmode=require"             --from-literal=DB_USER="$DB_USER"             --from-literal=DB_PASS="$DB_PASS"             --from-literal=JWT_SECRET="$JWT_SECRET"             --from-literal=MAIL_USERNAME="${MAIL_USERNAME:-change-me@example.com}"             --from-literal=MAIL_PASSWORD="${MAIL_PASSWORD:-change-me}"             --dry-run=client -o yaml | kubectl apply -f -

      # Observabilidade (ver docs/observability.md). A license key vem de um
      # secret do GitHub e vira um Secret do K8s — nunca é versionada.
      # O ConfigMap separa homolog de produção no New Relic (nome da app + label env).
      - name: Criar Secret e ConfigMap do New Relic
        env:
          NR_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NR_ENV: ${{ github.ref_name == 'homolog' && 'homolog' || 'production' }}
          NR_APP_NAME: ${{ github.ref_name == 'homolog' && 'tech-challenge-app-homolog' || 'tech-challenge-app' }}
        run: |
          kubectl -n "$K8S_NAMESPACE" create secret generic newrelic-license \
            --from-literal=license_key="$NR_KEY" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$K8S_NAMESPACE" create configmap newrelic-config \
            --from-literal=NEW_RELIC_APP_NAME="$NR_APP_NAME" \
            --from-literal=NEW_RELIC_LABELS="env:$NR_ENV;team:grupo15" \
            --from-literal=NEW_RELIC_METADATA_KUBERNETES_CLUSTER_NAME="$EKS_CLUSTER_NAME" \
            --dry-run=client -o yaml | kubectl apply -f -

      # CPU/memória/eventos do cluster. Idempotente: reinstala sozinho quando o
      # cluster do AWS Academy é recriado. Logs ficam com o agente APM
      # (logging.enabled=false evita logs duplicados).
      # webhook.enabled=false: o webhook de metadata-injection tem o caBundle
      # reescrito pelo job kube-webhook-certgen, o que conflita com o
      # server-side apply do Helm 4 e quebra o upgrade. As variáveis que ele
      # injetaria (pod/nó/cluster de cada transação do APM) são declaradas
      # direto no k8s/app-deployment.yaml. Desligado também libera ~100m de CPU.
      - name: Instalar/atualizar New Relic Kubernetes integration
        env:
          NR_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo update
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --namespace newrelic --create-namespace \
            --set global.licenseKey="$NR_KEY" \
            --set global.cluster="$EKS_CLUSTER_NAME" \
            --set newrelic-infrastructure.privileged=true \
            --set kube-state-metrics.enabled=true \
            --set kubeEvents.enabled=true \
            --set logging.enabled=false \
            --set webhook.enabled=false

      - name: Aplicar Manifests Kubernetes
        run: |
          # Tira o secret.yaml (placeholders) do apply, para não sobrescrever o
          # Secret real criado no passo anterior.
          sed -i '/^  - secret.yaml$/d' k8s/kustomization.yaml
          kubectl apply -k k8s/

      - name: Atualizar Imagem do Deployment
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=${{ needs.build-and-push-image.outputs.image }}"

      - name: Aguardar Rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$K8S_DEPLOYMENT" --timeout=300s
