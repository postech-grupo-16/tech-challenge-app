apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tech-challenge-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tech-challenge-app
  minReplicas: 2
  maxReplicas: 6
  # Só CPU: a JVM reserva heap ao subir e não devolve, então a memória fica
  # sempre "alta" mesmo sem carga e escalaria réplicas à toa (ver ADR 0002).
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
