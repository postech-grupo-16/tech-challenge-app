apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-challenge-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tech-challenge-app
  template:
    metadata:
      labels:
        app: tech-challenge-app
    spec:
      containers:
        - name: app
          image: tech-challenge-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tech-challenge-config
            - secretRef:
                name: tech-challenge-secrets
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: DB_PASS
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: SPRING_DATASOURCE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: JWT_SECRET
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: MAIL_PASSWORD
            # --- New Relic APM (ver docs/observability.md) ---
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/newrelic/newrelic.jar"
            # Secret criado pelo pipeline a partir de secrets.NEW_RELIC_LICENSE_KEY.
            # optional: sem o Secret (ex.: Kind local) o agente se desativa e a app sobe normal.
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license
                  key: license_key
                  optional: true
            # Nome da app e ambiente vêm do ConfigMap newrelic-config, criado pelo
            # pipeline (tech-challenge-app em produção, tech-challenge-app-homolog em homolog)
            - name: NEW_RELIC_APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: newrelic-config
                  key: NEW_RELIC_APP_NAME
                  optional: true
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
            # Envia o MDC (requestId do RequestIdFilter) junto com cada log
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_CONTEXT_DATA_ENABLED
              value: "true"
            # 4xx são erros do cliente (validação, não encontrado) — não contam como falha
            - name: NEW_RELIC_ERROR_COLLECTOR_IGNORE_STATUS_CODES
              value: "400-499"
            - name: NEW_RELIC_LABELS
              valueFrom:
                configMapKeyRef:
                  name: newrelic-config
                  key: NEW_RELIC_LABELS
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
